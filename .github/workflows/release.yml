name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  # changesets/action pushes the "Version Packages" branch and opens its PR,
  # and after a publish pushes a git tag per package.
  contents: write
  pull-requests: write
  # Required for npm trusted publishing: lets the job mint a GitHub OIDC token
  # that pnpm exchanges for a short-lived npm publish token.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the exact toolchain pinned in mise.toml (node 24.19.0 + pnpm
      # 11.24.0) and prepends the tool paths to GITHUB_PATH, so every later
      # step -- including changesets/action's publish script -- uses the
      # mise-provided node and pnpm. Unlike actions/setup-node with
      # `registry-url`, mise never generates an .npmrc, so there is no
      # NODE_AUTH_TOKEN placeholder that could shadow the OIDC trusted-publishing
      # flow (npm/cli#8730). Node 24 bundles npm >= 11.5.1, the trusted-publishing
      # minimum, though the publish itself runs through pnpm (see below).
      #
      # The job caches nothing (`cache: false` here, no pnpm store cache), per
      # npm's trusted-publishing guidance to never cache in release builds: a
      # poisoned cache entry would run with this job's publish permissions.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      # With pending changesets, the action opens or updates the "Version
      # Packages" PR. Otherwise it runs `pnpm release`: build, lint, typecheck,
      # and unit tests, then `changeset publish`. The verdaccio e2e suite stays
      # out of it: it runs `pnpm publish` itself, which does not belong in a job
      # that can mint npm publish tokens.
      #
      # Publishing is OIDC trusted publishing only; there is no NPM_TOKEN
      # secret. @changesets/cli v3 publishes each package with the detected
      # package manager (changesets/changesets#2097), and pnpm 11 exchanges the
      # job's OIDC token for a publish token natively (pnpm/pnpm#11495).
      #
      # For every package it publishes, `changeset publish` creates a git tag
      # and records it in the file named by CHANGESETS_OUTPUT, which the action
      # sets for the publish script; the action then pushes those tags. v1
      # scraped stdout for "New tag:" lines instead, which CLI v3 no longer
      # prints, so it pushed none. The action's `github-token` input defaults to
      # the job's GITHUB_TOKEN, so no env block is needed.
      #
      # GitHub Releases stay off. Each one would repeat the changelog that
      # already sits in the package's CHANGELOG.md, and every version bump
      # would create one release per published package.
      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          create-github-releases: false
