name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing: lets the job mint a GitHub OIDC token
  # that pnpm exchanges for a short-lived npm publish token.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the exact toolchain pinned in mise.toml (node 24.19.0 + pnpm
      # 11.24.0) and prepends the tool paths to GITHUB_PATH, so every later
      # step -- including changesets/action's `publish: pnpm release` -- uses
      # the mise-provided node and pnpm. The action caches the installed tools
      # by default. Unlike actions/setup-node with `registry-url`, mise never
      # generates an .npmrc, so there is no NODE_AUTH_TOKEN placeholder that
      # could shadow the OIDC trusted-publishing flow (npm/cli#8730). Node 24
      # bundles npm >= 11.5.1, the trusted-publishing minimum, though the
      # publish itself runs through pnpm (see below).
      - uses: jdx/mise-action@v4
      # mise-action only caches the tools themselves, so cache the pnpm store
      # separately to speed up `pnpm install`.
      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      # Publish chain: changesets/action -> `pnpm release` -> `changeset
      # publish`. @changesets/cli v3 routes the actual publish through the
      # detected package manager (changesets/changesets#2097), so each package
      # is published with `pnpm publish`. pnpm 11 implements npm trusted
      # publishing natively and attempts the OIDC exchange first, falling back
      # to a static token only when OIDC is not applicable (pnpm/pnpm#11495).
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback only. When the NPM_TOKEN secret is unset this is empty and
          # publishing relies purely on the trusted publisher configured on
          # npmjs.com for each package.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
