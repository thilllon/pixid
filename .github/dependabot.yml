version: 2

updates:
  # pnpm resolves every workspace package through the single root
  # pnpm-lock.yaml, so "/" is the only directory this entry may name.
  # Dependabot reads the `packages` globs out of pnpm-workspace.yaml and pulls
  # in packages/*/package.json from here, so every workspace manifest is covered
  # by the one entry. Adding /packages/* as a second directory makes Dependabot
  # raise MisconfiguredTooling, because the lockfile it would have to touch
  # lives in the parent directory (dependabot-core#11487).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Seoul'
    # Our manifests carry tight caret floors (`^5.9.3`), so bump the floor
    # instead of the default library behaviour, which would widen `^1.0.0` into
    # `>=1.0.0 <3.0.0` on a major bump.
    versioning-strategy: 'increase'
    # Two grouped pull requests plus one slot for anything the group rules
    # cannot classify as major/minor/patch.
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Order matters: a dependency joins the first group it matches. Both groups
    # are needed -- dependencies matching no group are opened one pull request
    # each, which is exactly what these groups exist to prevent.
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-major:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['major']
    # Belt and braces. Dependabot already skips our own packages twice over: its
    # manifest parser drops any requirement starting with `workspace:`, and it
    # drops any dependency whose name matches the `name` field of a workspace
    # manifest. This rule keeps that guarantee if a `workspace:^` range is ever
    # replaced by a real one -- internal versions belong to changesets.
    ignore:
      - dependency-name: '@pixid/*'
      # typescript-eslint's peer range stops below TypeScript 6.1, and
      # TypeScript 7 breaks its parser outright, so a TypeScript major would
      # break `pnpm lint`. Take TypeScript majors by hand once typescript-eslint
      # supports them, then drop this rule.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Dependabot precision-matches the ref it finds. A ref on a floating major tag
  # (`actions/checkout@v7`) can only ever be replaced by another major tag, so
  # it only shows up in actions-major. A ref pinned to a full commit SHA with a
  # `# vX.Y.Z` comment is bumped within its major too, in
  # actions-minor-and-patch.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 2
    # github-actions has no dev/prod split, so the scope is spelled out in the
    # prefix rather than left to `include: scope`.
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-major:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['major']
