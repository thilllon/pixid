# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews every pull request; it is free on public repositories.
# It reads AGENTS.md as coding guidelines on its own, so repository rules stay
# there. This file only tunes the review itself.
language: en-US

reviews:
  # "chill" sticks to substantive findings; "assertive" adds nits.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  review_status: true
  # Generated or machine-owned files are noise for a reviewer.
  path_filters:
    - '!pnpm-lock.yaml'
    - '!**/dist/**'
    - '!**/CHANGELOG.md'
    - '!assets/*.png'
  path_instructions:
    - path: 'packages/*/src/**/*.ts'
      instructions: >-
        Published library code with zero runtime dependencies: flag any new import that is not
        from @pixid/* or a Node built-in. The seed-to-grid and palette output must stay identical
        to ethereum-blockies for the same inputs, so flag any change to the PRNG, the mirroring,
        or the color math unless the pull request says that is the point.
    - path: 'packages/*/src/**/*.test.{ts,tsx}'
      instructions: >-
        Tests read each package's built dist/, so a test that imports source paths directly is a
        mistake. Bundle-size budgets in bundle.test.ts are only raised deliberately, with the
        README's Size table updated in the same pull request.
    - path: '.github/workflows/**'
      instructions: >-
        Check for event data used inside `run:` without an env indirection, missing
        `permissions:` blocks, and third-party actions that are not pinned to a commit SHA
        (GitHub-owned and Dependabot actions may use a floating major).
  auto_review:
    enabled: true
    drafts: false
    # Dependabot pull requests merge themselves once CI is green and only move
    # dependency ranges and the lockfile; the "Version Packages" pull request is
    # generated by changesets. Neither needs a review.
    ignore_usernames:
      - 'dependabot[bot]'
      - 'github-actions[bot]'
  tools:
    # CI already runs eslint on every pull request.
    eslint:
      enabled: false

chat:
  auto_reply: true
